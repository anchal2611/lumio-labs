services:
  - type: web
    name: lumio-platform
    runtime: node
    region: singapore   # closest to India
    plan: free

    # Build: install deps + compile TypeScript server + build React client
    buildCommand: npm run render-build

    # Start: run the compiled server (which also serves client/dist)
    startCommand: node server/dist/index.js

    # Health check
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true      # Render auto-generates a secure random value
      - key: DATA_DIR
        value: ./data            # Free instances have ephemeral local storage
      - key: FIREBASE_PROJECT_ID
        value: lumio-e3c95
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_URL
        value: https://ce.judge0.com
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyD6VJbejH09YUbBGwfmMWYn4i36fw0Vj4s
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: lumio-e3c95.firebaseapp.com
      - key: VITE_FIREBASE_DATABASE_URL
        value: https://lumio-e3c95-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: VITE_FIREBASE_PROJECT_ID
        value: lumio-e3c95
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: lumio-e3c95.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "959607549702"
      - key: VITE_FIREBASE_APP_ID
        value: "1:959607549702:web:1b04cbaad8f58ee3483887"
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: G-2NP3J5WCK8
