version: '3.8'

services:
  lumio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumio-platform
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
    volumes:
      - lumio_data:/data
    restart: unless-stopped

volumes:
  lumio_data:
